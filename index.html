<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Clikker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Point Clicker</span>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="pointsDisplay">0</span>
          <span class="stat-label">points</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-value" id="ppsDisplay">0</span>
          <span class="stat-label">per second</span>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">

    <section class="click-panel">
      <div class="click-stage">
        <button id="clickButton" class="click-button" aria-label="Click to earn points">
          <span class="click-button-value" id="clickButtonValue">+1</span>
        </button>
        <p class="click-hint">Click the button to earn points</p>
      </div>
    </section>

    <section class="shop-panel">
      <div class="shop-header">
        <h2>Shop</h2>
        <p>Buy generators to earn points automatically</p>
      </div>

      <div class="shop-list" id="shopList"></div>
      </div>

       <button id="resetButton" class="reset-button">Reset Progress</button>
    </section>

  </main>

  <div id="resetModal" class="modal-overlay hidden">
    <div class="modal">
      <h3>Reset your progress?</h3>
      <p>This will permanently delete your points, upgrades and saved data. This cannot be undone.</p>
      <div class="modal-actions">
        <button id="cancelReset" class="modal-btn modal-btn-secondary">Cancel</button>
        <button id="confirmReset" class="modal-btn modal-btn-danger">Reset</button>
      </div>
    </div>
  </div>
  <div id="floatingLayer" class="floating-layer"></div>

  <script src="script.js"></script>
</body>
</html>
