<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ball Clicker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Ball Clicker</span>
      </div>

      <div class="stats">

        <div class="stat">
          <span class="stat-value" id="pointsDisplay">0</span>
          <span class="stat-label">punten</span>
        </div>

        <div class="stat-divider"></div>

        <div class="stat">
          <span class="stat-value" id="ppsDisplay">0</span>
          <span class="stat-label">per seconde</span>
        </div>

      </div>

    </div>
  </header>


  <main class="layout">

    <!-- LINKERKANT: VOETBALVELD EN BAL -->
    <section class="click-panel">

      <div class="click-stage">

        <button
          id="clickButton"
          class="click-button"
          aria-label="Klik op de voetbal om punten te verdienen"
        >

          <img
            id="ballImage"
            src="soccer-ball.png"
            alt="Voetbal"
            class="ball-image"
          >

          <span
            class="click-button-value"
            id="clickButtonValue"
          >
            +1
          </span>

        </button>

        <p class="click-hint">
          Klik op de bal om punten te verdienen
        </p>

      </div>

    </section>


    <!-- RECHTERKANT: SHOP -->
    <section class="shop-panel">

      <div class="shop-header">
        <h2>Shop</h2>
        <p>Koop gebouwen en upgrades</p>
      </div>


      <!-- GEBOUWEN -->
      <div class="store-section">

        <h3>Gebouwen</h3>

        <div
          class="shop-list"
          id="shopList"
        ></div>

      </div>


      <!-- UPGRADES -->
      <div class="store-section">

        <h3>Upgrades</h3>

        <div
          class="shop-list"
          id="upgradeList"
        ></div>

      </div>


      <!-- RESET -->
      <button
        id="resetButton"
        class="reset-button"
      >
        Reset Progress
      </button>

    </section>

  </main>


  <!-- RESET POPUP -->
  <div
    id="resetModal"
    class="modal-overlay hidden"
  >

    <div class="modal">

      <h3>Voortgang resetten?</h3>

      <p>
        Dit verwijdert al je punten, gebouwen,
        upgrades en opgeslagen gegevens.
        Dit kan niet ongedaan worden gemaakt.
      </p>

      <div class="modal-actions">

        <button
          id="cancelReset"
          class="modal-btn modal-btn-secondary"
        >
          Annuleren
        </button>

        <button
          id="confirmReset"
          class="modal-btn modal-btn-danger"
        >
          Reset
        </button>

      </div>

    </div>

  </div>


  <!-- +1 ANIMATIES -->
  <div
    id="floatingLayer"
    class="floating-layer"
  ></div>


  <script src="script.js"></script>

</body>

</html>
